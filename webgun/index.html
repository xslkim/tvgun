<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>手机光枪</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #cam, #testsrc {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #testsrc { display: none; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    font: 13px/1.6 monospace; white-space: pre; pointer-events: none;
    color: #0f0; text-shadow: 0 0 4px #000, 0 0 4px #000;
  }
  #err {
    position: fixed; z-index: 20; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    max-width: 80%; padding: 16px 20px; display: none;
    color: #fff; background: rgba(180, 0, 0, .85);
    font: 15px/1.7 sans-serif; border-radius: 8px; white-space: pre-wrap;
  }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="testsrc" width="640" height="360"></canvas>
<canvas id="overlay"></canvas>
<div id="hud"></div>
<div id="err"></div>
<script src="gun.js" defer></script>
</body>
</html>
